name: Update Media Files List

on:
  push:
    branches: [ main ]
    paths: 
      - 'data/images/**'
      - 'data/videos/**'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-media-list:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Create media files list
      run: |
        echo "🔄 Generating media files list..."
        
        # Create output directory
        mkdir -p api
        
        # Initialize counters
        image_count=0
        video_count=0
        images_json=""
        videos_json=""
        
        # Process images
        echo "📸 Processing images..."
        if [ -d "data/images" ]; then
          for img_file in data/images/*; do
            if [ -f "$img_file" ]; then
              filename=$(basename "$img_file")
              extension="${filename##*.}"
              extension_lower=$(echo "$extension" | tr '[:upper:]' '[:lower:]')
              
              # Check if it's an image file
              case "$extension_lower" in
                jpg|jpeg|png|gif|webp|bmp|svg)
                  size=$(stat -c%s "$img_file" 2>/dev/null || echo "0")
                  modified=$(stat -c%Y "$img_file" 2>/dev/null || echo "0")
                  
                  if [ $image_count -gt 0 ]; then
                    images_json="$images_json,"
                  fi
                  
                  images_json="$images_json
            {
              \"filename\": \"$filename\",
              \"path\": \"data/images/$filename\",
              \"size\": $size,
              \"modified\": $modified,
              \"extension\": \"$extension_lower\"
            }"
                  image_count=$((image_count + 1))
                  echo "  Found image: $filename"
                  ;;
              esac
            fi
          done
        else
          echo "  � data/images directory not found"
        fi
        
        # Process videos
        echo "🎬 Processing videos..."
        if [ -d "data/videos" ]; then
          for vid_file in data/videos/*; do
            if [ -f "$vid_file" ]; then
              filename=$(basename "$vid_file")
              extension="${filename##*.}"
              extension_lower=$(echo "$extension" | tr '[:upper:]' '[:lower:]')
              
              # Check if it's a video file
              case "$extension_lower" in
                mp4|webm|ogg|mov|avi|mkv)
                  size=$(stat -c%s "$vid_file" 2>/dev/null || echo "0")
                  modified=$(stat -c%Y "$vid_file" 2>/dev/null || echo "0")
                  
                  if [ $video_count -gt 0 ]; then
                    videos_json="$videos_json,"
                  fi
                  
                  videos_json="$videos_json
            {
              \"filename\": \"$filename\",
              \"path\": \"data/videos/$filename\",
              \"size\": $size,
              \"modified\": $modified,
              \"extension\": \"$extension_lower\"
            }"
                  video_count=$((video_count + 1))
                  echo "  Found video: $filename"
                  ;;
              esac
            fi
          done
        else
          echo "  📁 data/videos directory not found"
        fi
        
        # Generate final JSON
        current_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        
        cat > api/media-files.json << EOF
        {
          "success": true,
          "generated_at": "$current_time",
          "data": {
            "images": [$images_json
            ],
            "videos": [$videos_json
            ]
          },
          "total_images": $image_count,
          "total_videos": $video_count
        }
        EOF
        
        echo "✅ Generated media list:"
        echo "   📸 Images: $image_count"
        echo "   🎬 Videos: $video_count"
        echo "   📄 Output: api/media-files.json"
        
        # Show generated JSON content for debugging
        echo "📄 Generated JSON content:"
        cat api/media-files.json
        
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Check if there are any changes
        if ! git diff --quiet api/media-files.json 2>/dev/null; then
          echo "📝 Changes detected in media-files.json"
          git add api/media-files.json
          git commit -m "🤖 Auto-update media files list [$(date +'%Y-%m-%d %H:%M:%S')]"
          git push
          echo "✅ Changes committed and pushed"
        else
          echo "ℹ️ No changes to commit - media-files.json is up to date"
        fi
