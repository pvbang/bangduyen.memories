name: Update Media Files List

on:
  push:
    branches: [ main ]
    paths: 
      - 'data/images/**'
      - 'data/videos/**'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-media-list:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Create media files list
      shell: bash
      run: |
        set -e
        
        echo "🔄 Generating media files list..."
        
        # Create output directory
        mkdir -p api
        
        # Enable nullglob to handle no matches
        shopt -s nullglob
        
        # Function to get file info
        get_file_info() {
          local file_path=$1
          local relative_path=$2
          
          if [ -f "$file_path" ]; then
            local filename=$(basename "$file_path")
            local extension="${filename##*.}"
            local size=$(stat -c%s "$file_path" 2>/dev/null || echo "0")
            local modified=$(stat -c%Y "$file_path" 2>/dev/null || echo "0")
            
            echo "{\"filename\": \"$filename\", \"path\": \"$relative_path/$filename\", \"size\": $size, \"modified\": $modified, \"extension\": \"$extension\"}"
          fi
        }
        
        # Process images
        echo "📸 Processing images..."
        images_json=""
        image_count=0
        
        if [ -d "data/images" ]; then
          for img_file in data/images/*.{jpg,jpeg,png,gif,webp,bmp,svg,JPG,JPEG,PNG,GIF,WEBP,BMP,SVG}; do
            if [ -f "$img_file" ]; then
              if [ $image_count -gt 0 ]; then
                images_json="$images_json,"
              fi
              info=$(get_file_info "$img_file" "data/images")
              images_json="$images_json$info"
              image_count=$((image_count + 1))
            fi
          done
        fi
        
        # Process videos
        echo "🎬 Processing videos..."
        videos_json=""
        video_count=0
        
        if [ -d "data/videos" ]; then
          for vid_file in data/videos/*.{mp4,webm,ogg,mov,avi,mkv,MP4,WEBM,OGG,MOV,AVI,MKV}; do
            if [ -f "$vid_file" ]; then
              if [ $video_count -gt 0 ]; then
                videos_json="$videos_json,"
              fi
              info=$(get_file_info "$vid_file" "data/videos")
              videos_json="$videos_json$info"
              video_count=$((video_count + 1))
            fi
          done
        fi
        
        # Generate final JSON
        current_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        
        cat > api/media-files.json << EOF
        {
          "success": true,
          "generated_at": "$current_time",
          "data": {
            "images": [$images_json],
            "videos": [$videos_json]
          },
          "total_images": $image_count,
          "total_videos": $video_count
        }
        EOF
        
        echo "✅ Generated media list:"
        echo "   📸 Images: $image_count"
        echo "   🎬 Videos: $video_count"
        echo "   📄 Output: api/media-files.json"
        
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        if [ -n "$(git status --porcelain)" ]; then
          git add api/media-files.json
          git commit -m "🤖 Auto-update media files list [$(date +'%Y-%m-%d %H:%M:%S')]"
          git push
          echo "✅ Changes committed and pushed"
        else
          echo "ℹ️ No changes to commit"
        fi
